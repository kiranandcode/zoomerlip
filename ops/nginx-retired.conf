# Emergency fallback only. Never restore the retired proxy configuration.
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 503 "Zoomerlip is temporarily unavailable.\n";
}

server {
    listen 80;
    server_name kalshitrader.kirancodes.me;
    return 308 https://zoomerlip.kirancodes.me$request_uri;
}

server {
    listen 443 ssl;
    server_name kalshitrader.kirancodes.me;
    ssl_certificate @RETIREMENT_ARCHIVE@/fallback-tls/fullchain.pem;
    ssl_certificate_key @RETIREMENT_ARCHIVE@/fallback-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://zoomerlip.kirancodes.me$request_uri;
}
